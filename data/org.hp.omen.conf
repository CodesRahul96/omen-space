<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Daemon runs as root -->
  <policy user="root">
    <allow own="org.hp.omen"/>
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>

  <!-- Allow default users to receive signals and broadcast notifications from the daemon -->
  <policy context="default">
    <deny own="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>

  <!-- Allow users in the omen-hw hardware group to communicate with the daemon -->
  <policy group="omen-hw">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>

  <!-- Allow administrators in wheel and adm groups -->
  <policy group="wheel">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
  <policy group="adm">
    <allow send_destination="org.hp.omen"/>
    <allow receive_sender="org.hp.omen"/>
  </policy>
</busconfig>
